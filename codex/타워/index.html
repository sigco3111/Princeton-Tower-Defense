몇 개의 타워가 있나요?\"},{\"@type\":\"Question\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes, Princeton Tower Defense is completely free to play in any modern web browser. No download, installation, or account required. The game runs on HTML5 Canvas and works on desktop and mobile browsers.\"},\"name\":\"프린스턴 타워 디펜스는 무료인가요?\"},{\"@type\":\"Question\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Princeton Tower Defense has 26 levels spread across 5 themed regions: Princeton Grounds (grassland with Poe Field, Carnegie Lake, Nassau Hall), Murky Marshes (swamp with Murky Bog, Witch's Domain, Sunken Temple), Sahara Sands (desert with Desert Oasis, Pyramid Pass, Sphinx Gate), Frozen Frontier (winter with Glacier Path, Frost Fortress, Summit Peak), and Volcanic Depths (lava with Lava Fields, Caldera Basin, Obsidian Throne). Each region also includes challenge maps with special tower restrictions.\"},\"name\":\"프린스턴 타워 디펜스에는 어떤 지역과 맵이 있나요?\"},{\"@type\":\"Question\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes! Princeton Tower Defense includes a full custom level creator. You can design your own maps with primary and secondary enemy paths, place hero spawn points, add special objective structures (beacons, shrines, vaults, barracks), set theme-specific decorations and environmental hazards, pre-place towers, and compose custom enemy waves. Choose from 5 map themes: grassland, swamp, desert, winter, and volcanic.\"},\"name\":\"프린스턴 타워 디펜스에서 커스텀 레벨을 만들 수 있나요?\"},{\"@type\":\"Question\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Princeton Tower Defense features 9 playable heroes: 프린스턴 호랑이, 매시 기사, 아카펠라 테너, 로키 라쿤, F. 스콧, 머서 장군, BSE 엔지니어, 나소 불사조, 아이비 수호자. Each hero has unique active abilities and can be deployed on the battlefield to support your tower defenses. Heroes gain experience and can turn the tide during difficult waves.\"},\"name\":\"프린스턴 타워 디펜스에는 어떤 영웅이 있나요?\"},{\"@type\":\"Question\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Princeton Tower Defense stands out with its Princeton University campus theme. All towers, enemies, and maps reference real campus landmarks and student life. It features dual-lane enemy paths, 9 heroes with active abilities, a spell system with upgrades, environmental hazards like lava geysers and quicksand, special objective structures, challenge maps with tower restrictions, and a full custom level creator. It's built entirely with React and HTML5 Canvas with isometric rendering and no game engine.\"},\"name\":\"프린스턴 타워 디펜스는 다른 타워 디펜스 게임과 어떻게 다른가요?\"},{\"@type\":\"Question\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Princeton Tower Defense is built with Next.js 16, React 19, TypeScript, and HTML5 Canvas. The entire rendering pipeline (isometric terrain, tower animations, projectile arcs, death effects, fog, god rays, and ambient particles) is hand-written Canvas 2D with no game engine or sprite sheets. Static layers are cached to offscreen canvases, quality-aware rendering adjusts detail based on runtime performance, and the UI uses Tailwind CSS with Radix Themes. Created by Kevin Liu (kevin-liu.tech).\"},\"name\":\"프린스턴 타워 디펜스는 어떤 기술로 만들어졌나요?\"}]},{\"@type\":\"BreadcrumbList\",\"itemListElement\":[{\"@type\":\"ListItem\",\"item\":\"https://www.ptd.quest\",\"name\":\"홈\",\"position\":1},{\"@type\":\"ListItem\",\"item\":\"https://www.ptd.quest/codex\",\"name\":\"도감\",\"position\":2},{\"@type\":\"ListItem\",\"item\":\"https://www.ptd.quest/creator\",\"name\":\"Level Creator\",\"position\":2},{\"@type\":\"ListItem\",\"item\":\"https://www.ptd.quest/credits\",\"name\":\"제작진\",\"position\":2}]},{\"@type\":\"SoftwareSourceCode\",\"author\":{\"@id\":\"https://www.ptd.quest/#author\"},\"codeRepository\":\"https://github.com/Kevin-Liu-01/Princeton-Tower-Defense\",\"dateCreated\":\"2024-12-01\",\"license\":\"https://opensource.org/licenses/MIT\",\"name\":\"프린스턴 타워 디펜스\",\"programmingLanguage\":[\"TypeScript\",\"React 19\",\"Next.js 16\"],\"runtimePlatform\":\"Web B
